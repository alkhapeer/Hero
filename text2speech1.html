<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل النص إلى صوت مع تصدير MP3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 30px;
            max-width: 1000px;
            width: 100%;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #2c3e50; font-weight: 300; }
        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
            background: #ecf9ff;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area.dragover { background: #d4eaff; border-color: #2980b9; }
        .upload-area input[type="file"] { display: none; }
        .upload-area label {
            display: inline-block;
            background: #3498db;
            color: #fff;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
            border: none;
        }
        .upload-area label:hover { background: #2980b9; transform: scale(1.02); }
        .upload-area p { margin-top: 15px; color: #555; font-size: 14px; }
        .file-info { text-align: center; margin: 10px 0; font-weight: bold; color: #2c3e50; }
        .text-box textarea {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            border: 1px solid #ccc;
            padding: 15px;
            font-size: 18px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            line-height: 1.8;
            resize: vertical;
            background: #fafafa;
        }
        .text-box textarea:focus { border-color: #3498db; outline: none; box-shadow: 0 0 0 3px rgba(52,152,219,0.2); }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        .controls button {
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: #ecf0f1;
            color: #2c3e50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .controls button.primary { background: #2ecc71; color: #fff; }
        .controls button.primary:hover { background: #27ae60; }
        .controls button.danger { background: #e74c3c; color: #fff; }
        .controls button.danger:hover { background: #c0392b; }
        .controls button.warning { background: #f1c40f; color: #fff; }
        .controls button.warning:hover { background: #f39c12; }
        .controls button.export { background: #e67e22; color: #fff; }
        .controls button.export:hover { background: #d35400; }
        .controls select, .controls label { font-size: 14px; }
        .sliders {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 16px;
        }
        .sliders label { font-weight: 600; color: #2c3e50; margin-left: 5px; }
        .sliders input[type="range"] { width: 120px; accent-color: #3498db; }
        .voice-select, .lang-export {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #ccc;
            font-size: 14px;
            background: #fff;
            min-width: 150px;
        }
        .tashkeel-btn { background: #9b59b6; color: #fff; }
        .tashkeel-btn:hover { background: #8e44ad; }
        .warning-msg {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ffeeba;
            margin: 10px 0;
            text-align: center;
            display: none;
        }
        .status-msg {
            margin: 10px 0;
            padding: 8px;
            border-radius: 6px;
            background: #e8f0fe;
            color: #1a0dab;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .footer { margin-top: 20px; text-align: center; font-size: 12px; color: #888; }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            .controls button { padding: 8px 14px; font-size: 13px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔊 تحويل النص إلى صوت + تصدير MP3</h1>
    <div id="voiceWarning" class="warning-msg">
        ⚠️ لم يتم العثور على صوت عربي. تأكد من تثبيت حزمة اللغة العربية في نظامك.
    </div>
    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept=".txt,.docx">
        <label for="fileInput">📂 اختر ملف (TXT أو DOCX)</label>
        <p>أو اسحب الملف إلى هنا</p>
    </div>
    <div id="fileInfo" class="file-info"></div>

    <div class="text-box">
        <textarea id="textArea" placeholder="الصق النص هنا أو ارفع ملفاً"></textarea>
    </div>

    <!-- شريط التحكم الأساسي -->
    <div class="controls">
        <button class="primary" id="playBtn">▶ تشغيل</button>
        <button class="warning" id="pauseBtn">⏸️ إيقاف مؤقت</button>
        <button class="danger" id="stopBtn">⏹ إيقاف</button>
        <select id="voiceSelect" class="voice-select"></select>
        <button id="tashkeelBtn" class="tashkeel-btn">🔤 تشكيل النص</button>
        <label><input type="checkbox" id="normalizeCheck" checked> تطبيع</label>
    </div>

    <!-- شريط التصدير إلى MP3 -->
    <div class="controls" style="border-top: 1px solid #ddd; padding-top: 15px; margin-top: 0;">
        <select id="exportLang" class="lang-export">
            <option value="ar-sa">العربية (ar-SA)</option>
            <option value="en-us">الإنجليزية (en-US)</option>
            <option value="auto">تلقائي</option>
        </select>
        <button id="exportBtn" class="export">📥 تصدير MP3 (VoiceRSS)</button>
        <span id="exportStatus" class="status-msg"></span>
    </div>

    <!-- شرائح السرعة والطبقة -->
    <div class="sliders">
        <label>السرعة: <span id="rateVal">1.0</span></label>
        <input type="range" id="rateSlider" min="0.5" max="2.0" step="0.1" value="1.0">
        <label>طبقة الصوت: <span id="pitchVal">1.0</span></label>
        <input type="range" id="pitchSlider" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="footer">يعمل في جميع المتصفحات الحديثة. VoiceRSS مجاني حتى 500 حرف يومياً (تحتاج مفتاح API).</div>
</div>
<script>
    (function() {
        // --- عناصر DOM ---
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileInfo = document.getElementById('fileInfo');
        const textArea = document.getElementById('textArea');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const voiceSelect = document.getElementById('voiceSelect');
        const rateSlider = document.getElementById('rateSlider');
        const pitchSlider = document.getElementById('pitchSlider');
        const rateVal = document.getElementById('rateVal');
        const pitchVal = document.getElementById('pitchVal');
        const normalizeCheck = document.getElementById('normalizeCheck');
        const tashkeelBtn = document.getElementById('tashkeelBtn');
        const voiceWarning = document.getElementById('voiceWarning');
        const exportBtn = document.getElementById('exportBtn');
        const exportLang = document.getElementById('exportLang');
        const exportStatus = document.getElementById('exportStatus');

        // --- متغيرات TTS ---
        let utterance = null;
        let isPaused = false;

        // --- دوال معالجة النص ---
        function normalizeArabic(text) {
            return text.replace(/[أإآ]/g, 'ا')
                       .replace(/ى/g, 'ي')
                       .replace(/ؤ/g, 'و')
                       .replace(/ئ/g, 'ي')
                       .replace(/\s+/g, ' ')
                       .trim();
        }

        // --- تشكيل النص (خدمة خارجية) ---
        async function tashkeelText(text) {
            try {
                const response = await fetch('https://tashkeel.herokuapp.com/api/tashkeel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                if (!response.ok) throw new Error('فشل التشكيل');
                const data = await response.json();
                return data.result || text;
            } catch (e) {
                console.warn('تعذر التشكيل', e);
                return text;
            }
        }

        // --- قراءة الملفات ---
        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e.target.error);
                reader.readAsText(file, 'UTF-8');
            });
        }

        function handleFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            fileInfo.textContent = `جاري قراءة: ${file.name}`;
            if (ext === 'txt') {
                readFileAsText(file).then(text => {
                    textArea.value = text;
                    fileInfo.textContent = `✅ تم قراءة الملف: ${file.name}`;
                }).catch(err => fileInfo.textContent = `❌ خطأ: ${err.message}`);
            } else if (ext === 'docx') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    mammoth.extractRawText({ arrayBuffer: e.target.result })
                        .then(result => {
                            textArea.value = result.value;
                            fileInfo.textContent = `✅ تم قراءة الملف: ${file.name}`;
                        }).catch(err => fileInfo.textContent = `❌ خطأ: ${err.message}`);
                };
                reader.onerror = () => fileInfo.textContent = '❌ خطأ في تحميل الملف';
                reader.readAsArrayBuffer(file);
            } else {
                fileInfo.textContent = '⚠️ نوع الملف غير مدعوم. يرجى رفع TXT أو DOCX.';
            }
        }

        // --- أحداث رفع الملف ---
        fileInput.addEventListener('change', function(e) {
            if (this.files.length) handleFile(this.files[0]);
        });
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); this.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', e => { e.preventDefault(); this.classList.remove('dragover'); });
        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });
        uploadArea.addEventListener('click', function(e) {
            if (e.target.tagName !== 'LABEL' && e.target.tagName !== 'INPUT') fileInput.click();
        });

        // --- تحميل الأصوات واختيار العربي ---
        function populateVoiceList() {
            const voices = speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            let arabicFound = false;
            voices.forEach(voice => {
                const opt = document.createElement('option');
                opt.value = voice.name;
                opt.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(opt);
                if (voice.lang.startsWith('ar')) arabicFound = true;
            });
            if (arabicFound) {
                const arabicVoice = voices.find(v => v.lang.startsWith('ar'));
                voiceSelect.value = arabicVoice.name;
                voiceWarning.style.display = 'none';
            } else {
                voiceWarning.style.display = 'block';
                if (voices.length) voiceSelect.selectedIndex = 0;
            }
        }
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        } else {
            setTimeout(populateVoiceList, 300);
        }
        setTimeout(populateVoiceList, 1000);

        // --- دوال النطق (TTS) ---
        function getTextToSpeak() {
            let text = textArea.value.trim();
            if (!text) { alert('الرجاء إدخال أو رفع نص أولاً.'); return null; }
            if (normalizeCheck.checked) text = normalizeArabic(text);
            return text;
        }

        function speak() {
            const text = getTextToSpeak();
            if (!text) return;
            if (speechSynthesis.speaking) speechSynthesis.cancel();
            utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = parseFloat(rateSlider.value);
            utterance.pitch = parseFloat(pitchSlider.value);
            const selectedVoiceName = voiceSelect.value;
            const voices = speechSynthesis.getVoices();
            const voice = voices.find(v => v.name === selectedVoiceName);
            if (voice) { utterance.voice = voice; utterance.lang = voice.lang; }
            else utterance.lang = 'ar-SA';
            utterance.onend = function() { isPaused = false; playBtn.textContent = '▶ تشغيل'; };
            utterance.onerror = function(e) {
                isPaused = false; playBtn.textContent = '▶ تشغيل';
                if (e.error === 'not-allowed') alert('الرجاء السماح باستخدام الصوت.');
            };
            isPaused = false;
            playBtn.textContent = '⏸️ تشغيل (مستمر)';
            speechSynthesis.speak(utterance);
        }

        playBtn.addEventListener('click', function() {
            if (speechSynthesis.paused) {
                speechSynthesis.resume();
                isPaused = false;
                this.textContent = '⏸️ تشغيل (مستمر)';
                return;
            }
            if (speechSynthesis.speaking) return;
            speak();
        });
        pauseBtn.addEventListener('click', function() {
            if (speechSynthesis.speaking && !speechSynthesis.paused) {
                speechSynthesis.pause();
                isPaused = true;
                playBtn.textContent = '▶ تشغيل';
            } else alert('لا يوجد نص يُقرأ حالياً.');
        });
        stopBtn.addEventListener('click', function() {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
                isPaused = false;
                playBtn.textContent = '▶ تشغيل';
            }
        });

        // --- تحديث الشرائح ---
        rateSlider.addEventListener('input', () => rateVal.textContent = rateSlider.value);
        pitchSlider.addEventListener('input', () => pitchVal.textContent = pitchSlider.value);

        // --- زر التشكيل ---
        tashkeelBtn.addEventListener('click', async function() {
            const text = textArea.value.trim();
            if (!text) { alert('لا يوجد نص.'); return; }
            this.textContent = '⏳ جاري التشكيل...';
            this.disabled = true;
            try {
                const diac = await tashkeelText(text);
                textArea.value = diac;
                alert('تم التشكيل.');
            } catch (e) { alert('فشل التشكيل: ' + e.message); }
            finally { this.textContent = '🔤 تشكيل النص'; this.disabled = false; }
        });

        // ================================================================
        //              زر تصدير MP3 باستخدام VoiceRSS
        // ================================================================
        const VOICERSS_API = 'https://api.voicerss.org/';
        const MAX_CHARS_PER_REQUEST = 500; // الحد المجاني

        function getApiKey() {
            let key = localStorage.getItem('voicerss_api_key');
            if (!key) {
                key = prompt('أدخل مفتاح API الخاص بخدمة VoiceRSS (يمكن الحصول عليه مجاناً من https://www.voicerss.org/):');
                if (key) localStorage.setItem('voicerss_api_key', key);
            }
            return key;
        }

        function setApiKey(newKey) {
            localStorage.setItem('voicerss_api_key', newKey);
        }

        // دالة لتحويل جزء من النص إلى Blob صوتي
        async function fetchVoiceChunk(text, lang, apiKey) {
            const params = new URLSearchParams({
                key: apiKey,
                hl: lang,
                src: text,
                c: 'mp3',
                f: '44khz_16bit_stereo'
            });
            const url = VOICERSS_API + '?' + params.toString();
            const response = await fetch(url);
            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`VoiceRSS Error (${response.status}): ${errText}`);
            }
            const blob = await response.blob();
            // التحقق من أن المحتوى هو MP3 وليس رسالة خطأ (بعض الأحيان ترجع نص)
            if (blob.type === 'text/html' || blob.type === 'text/plain') {
                const text = await blob.text();
                throw new Error(`VoiceRSS: ${text}`);
            }
            return blob;
        }

        // دالة لتقسيم النص إلى أجزاء مع مراعاة حدود الجمل
        function splitText(text, maxLen) {
            if (text.length <= maxLen) return [text];
            const parts = [];
            let remaining = text;
            while (remaining.length > 0) {
                let end = maxLen;
                // حاول القطع عند آخر مسافة أو نقطة داخل الحد
                const lastSpace = remaining.lastIndexOf(' ', maxLen);
                const lastDot = remaining.lastIndexOf('.', maxLen);
                const lastNewline = remaining.lastIndexOf('\n', maxLen);
                const cutIndex = Math.max(lastSpace, lastDot, lastNewline);
                if (cutIndex > 0) end = cutIndex + 1;
                parts.push(remaining.substring(0, end).trim());
                remaining = remaining.substring(end).trim();
            }
            return parts;
        }

        async function exportToMP3() {
            let text = textArea.value.trim();
            if (!text) { alert('لا يوجد نص للتصدير.'); return; }
            if (normalizeCheck.checked) text = normalizeArabic(text);

            // تحديد اللغة
            let lang = exportLang.value;
            if (lang === 'auto') {
                // كشف بسيط: إذا احتوى على أحرف عربية
                const arabicPattern = /[\u0600-\u06FF]/;
                lang = arabicPattern.test(text) ? 'ar-sa' : 'en-us';
            }

            // التحقق من المفتاح
            let apiKey = getApiKey();
            if (!apiKey) {
                alert('مطلوب مفتاح API. يمكنك الحصول عليه مجاناً من VoiceRSS.');
                return;
            }

            // عرض رسالة الحالة
            exportStatus.style.display = 'block';
            exportStatus.textContent = '⏳ جاري التصدير... قد يستغرق بعض الوقت حسب طول النص.';
            exportBtn.disabled = true;

            try {
                // تقسيم النص إلى أجزاء
                const parts = splitText(text, MAX_CHARS_PER_REQUEST);
                const blobs = [];

                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    exportStatus.textContent = `⏳ جاري تحويل الجزء ${i+1} من ${parts.length}...`;
                    try {
                        const blob = await fetchVoiceChunk(part, lang, apiKey);
                        blobs.push(blob);
                    } catch (err) {
                        // إذا كان الخطأ بسبب المفتاح أو الحصة اليومية
                        if (err.message.includes('API key') || err.message.includes('daily limit')) {
                            // حذف المفتاح المخزن لإعادة إدخاله
                            localStorage.removeItem('voicerss_api_key');
                            const newKey = prompt('يبدو أن المفتاح غير صالح أو انتهت الحصة اليومية. أدخل مفتاحاً جديداً:');
                            if (newKey) {
                                setApiKey(newKey);
                                // إعادة المحاولة للجزء الحالي
                                const retryBlob = await fetchVoiceChunk(part, lang, newKey);
                                blobs.push(retryBlob);
                            } else {
                                throw new Error('تم إلغاء العملية.');
                            }
                        } else {
                            throw err;
                        }
                    }
                }

                if (blobs.length === 0) throw new Error('لم يتم الحصول على أي بيانات صوتية.');

                // دمج الملفات الصوتية (نظراً لأنها MP3، يمكن دمجها ببساطة)
                const totalSize = blobs.reduce((acc, b) => acc + b.size, 0);
                const mergedBlob = new Blob(blobs, { type: 'audio/mpeg' });
                if (mergedBlob.size === 0) throw new Error('الملف الناتج فارغ.');

                // تحميل الملف
                const url = URL.createObjectURL(mergedBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `speech_${new Date().toISOString().slice(0,10)}.mp3`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                exportStatus.textContent = '✅ تم التصدير بنجاح!';
                setTimeout(() => { exportStatus.style.display = 'none'; }, 5000);
            } catch (error) {
                console.error(error);
                exportStatus.textContent = `❌ خطأ: ${error.message}`;
                alert('حدث خطأ أثناء التصدير: ' + error.message);
            } finally {
                exportBtn.disabled = false;
                // لا نخفي الحالة فوراً لنرى الرسالة
            }
        }

        exportBtn.addEventListener('click', exportToMP3);

        // تنبيه إذا لم تظهر الأصوات
        setTimeout(() => {
            if (speechSynthesis.getVoices().length === 0) {
                voiceWarning.textContent = '⚠️ لم يتم تحميل الأصوات بعد. حاول تحديث الصفحة أو استخدم Edge.';
                voiceWarning.style.display = 'block';
            }
        }, 3000);
    })();
</script>
</body>
</html>
