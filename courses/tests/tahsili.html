<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>اختبار التحصيلي التشخيصي</title>

    <style>
        * {
            box-sizing:border-box;
        }

        body {
            margin:0;
            font-family:Arial,sans-serif;
            background:#f8fafc;
            color:#172033;
        }

        .box {
            max-width:700px;
            margin:auto;
            padding:35px 20px;
            text-align:center;
        }

        .icon {
            font-size:65px;
        }

        h1 {
            margin:15px 0 10px;
            font-size:28px;
        }

        p {
            color:#64748b;
            line-height:1.9;
            font-size:15px;
        }

        .notice {
            margin:25px 0;
            padding:20px;
            border-radius:16px;
            background:#eff6ff;
            border:1px solid #bfdbfe;
        }

        .date {
            font-size:24px;
            font-weight:bold;
            color:#2563eb;
            margin-top:8px;
        }

        .btn {
            display:inline-block;
            padding:12px 25px;
            border-radius:10px;
            background:#2563eb;
            color:#fff;
            text-decoration:none;
            font-weight:bold;
            margin-top:10px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="icon">📚</div>

    <h1>اختبار التحصيلي التشخيصي</h1>

    <p>
        اختبار تشخيصي يساعدك على قياس مستواك
        ومعرفة المواد والمجالات التي تحتاج إلى تطويرها.
    </p>

    <div class="notice">

        <strong>📅 موعد إطلاق الاختبار</strong>

        <div class="date">
            5 سبتمبر 2026
        </div>

        <p>
            الاختبار سيكون متاحًا قريبًا.
        </p>

    </div>

    <p>
        هدفنا أن تعرف ماذا تدرس قبل أن تبدأ،
        وليس أن تذاكر كل شيء عشوائيًا.
    </p>

    <a class="btn" href="../index.html#courses">
        📚 استعرض دورات التحصيلي
    </a>

</div>

</body>
</html>
