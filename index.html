<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hero Academy | أكاديمية هيرو</title>

  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="theme-color" content="#2563eb">
</head>
<body>
    <div id="app">
        <header id="app-header">
            <div class="brand">
                <img src="/icons/icon-192.png" alt="Hero Academy" width="40" height="40">
                <span class="brand-name">Hero Academy</span>
                <span class="brand-sub">أكاديمية هيرو</span>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="btn-theme">🌙</button>
            </div>
        </header>

        <main id="main-content"></main>

        <nav id="bottom-nav">
            <ul>
                <li data-page="home" class="active"><span class="nav-icon">🏠</span><span class="nav-label">الرئيسية</span></li>
                <li data-page="apps"><span class="nav-icon">📱</span><span class="nav-label">التطبيقات</span></li>
                <li data-page="courses"><span class="nav-icon">📚</span><span class="nav-label">الدورات</span></li>
                <li data-page="my-courses"><span class="nav-icon">🎓</span><span class="nav-label">دوراتي</span></li>
                <li data-page="settings"><span class="nav-icon">⚙️</span><span class="nav-label">الإعدادات</span></li>
            </ul>
        </nav>

        <div id="activation-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2>🔑 تفعيل الدورة</h2>
                <p>أدخل كود التفعيل من صفحة <strong>دوراتي</strong> في الأكاديمية:</p>
                <input type="text" id="activation-code-input" placeholder="أدخل الكود هنا" dir="ltr">
                <button id="activation-submit-btn" class="btn btn-primary">✅ تفعيل</button>
                <div id="activation-message" style="margin-top:10px;color:#b00020;"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript بالترتيب الصحيح -->
    <script src="/js/storage.js"></script>
    <script src="/js/trial.js"></script>
    <script src="/js/activation.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
              .then(() => console.log('SW registered'))
              .catch(err => console.error('SW failed', err));
        }
    </script>
</body>
</html>
