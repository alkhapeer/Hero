<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <meta name="theme-color" content="#2563eb">

    <link rel="manifest" href="/Hero/manifest.webmanifest">

    <title>Hero Academy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="app"></div>

    <script src="js/app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/Hero/sw.js')
                    .then(registration => {
                        console.log(
                            '✅ Hero Service Worker registered:',
                            registration.scope
                        );
                    })
                    .catch(error => {
                        console.error(
                            '❌ Hero Service Worker registration failed:',
                            error
                        );
                    });
            });
        }
    </script>

</body>
</html>
