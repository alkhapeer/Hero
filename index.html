<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Academy | أكاديمية هيرو</title>

    <!-- أيقونات PWA -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#2563eb">

    <!-- SEO -->
    <meta name="description" content="تطبيقات ودورات تعليمية تفاعلية">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ============================================================
         تطبيق SPA - جميع الأقسام داخل index.html
    ============================================================ -->

    <div id="app">

        <!-- رأس التطبيق (ثابت) -->
        <header id="app-header">
            <div class="header-content">
                <div class="brand">
                    <img src="/icons/icon-192.png" alt="Hero Academy" width="40" height="40">
                    <span class="brand-name">Hero Academy</span>
                    <span class="brand-sub">أكاديمية هيرو</span>
                </div>
                <div class="header-actions">
                    <button id="install-btn" class="btn-install" style="display:none;">
                        📲 تثبيت التطبيق
                    </button>
                    <button id="theme-toggle" class="btn-theme" aria-label="تبديل الوضع الداكن">
                        🌙
                    </button>
                </div>
            </div>
        </header>

        <!-- المحتوى الرئيسي -->
        <main id="main-content">
            <!-- سيتم ملؤه بواسطة JavaScript -->
        </main>

        <!-- شريط التنقل السفلي (للهواتف) -->
        <nav id="bottom-nav">
            <ul>
                <li data-page="home" class="active">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-label">الرئيسية</span>
                </li>
                <li data-page="apps">
                    <span class="nav-icon">📱</span>
                    <span class="nav-label">التطبيقات</span>
                </li>
                <li data-page="courses">
                    <span class="nav-icon">📚</span>
                    <span class="nav-label">الدورات</span>
                </li>
                <li data-page="my-courses">
                    <span class="nav-icon">🎓</span>
                    <span class="nav-label">دوراتي</span>
                </li>
                <li data-page="settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">الإعدادات</span>
                </li>
            </ul>
        </nav>

        <!-- نافذة منبثقة للتفعيل -->
        <div id="activation-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2>تفعيل الدورة</h2>
                <p>أدخل كود التفعيل الذي حصلت عليه من صفحة <strong>دوراتي</strong> في الأكاديمية:</p>
                <input type="text" id="activation-code-input" placeholder="مثال: HERO-XXXX-XXXX-XXXX">
                <button id="activation-submit-btn">تفعيل</button>
                <div id="activation-message" style="margin-top:10px;color:#b00020;"></div>
            </div>
        </div>

    </div>

    <!-- ============================================================
         JavaScript
    ============================================================ -->

    <!-- مكتبات مساعدة -->
    <script src="/js/storage.js"></script>
    <script src="/js/trial.js"></script>
    <script src="/js/activation.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/app.js"></script>

    <!-- تسجيل Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('Service Worker registered'))
                .catch(err => console.error('SW registration failed:', err));
        }
    </script>
</body>
</html>
