<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الكيمياء التحصيلي المتقدم</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            background: #f0f4f8;
            color: #1e293b;
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            padding: 28px 32px 40px;
            transition: all 0.2s;
        }
        /* ===== TYPOGRAPHY ===== */
        h1,
        h2,
        h3 {
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        h1 {
            font-size: 28px;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #64748b;
            margin-right: auto;
        }
        .subtitle {
            color: #475569;
            font-size: 15px;
            margin-top: 4px;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 16px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        /* ===== BADGES ===== */
        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            background: #e9edf2;
            color: #334155;
        }
        .badge-difficulty-easy {
            background: #dcfce7;
            color: #166534;
        }
        .badge-difficulty-medium {
            background: #fef9c3;
            color: #854d0e;
        }
        .badge-difficulty-hard {
            background: #fee2e2;
            color: #991b1b;
        }
        .badge-dose {
            background: #dbeafe;
            color: #1e40af;
        }
        .badge-topic {
            background: #f3e8ff;
            color: #6b21a5;
        }
        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 28px;
            background: #f8fafc;
            border-radius: 20px;
            padding: 14px 22px;
            margin: 16px 0 22px;
            border: 1px solid #e2e8f0;
            align-items: center;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .stat-item .num {
            font-weight: 700;
            font-size: 18px;
            color: #0b2b4a;
            min-width: 24px;
        }
        .stat-item .label {
            color: #475569;
        }
        .stat-divider {
            width: 1px;
            height: 28px;
            background: #d1d9e6;
        }
        /* ===== FILTERS ===== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            margin-bottom: 22px;
            padding: 12px 0 8px;
            border-top: 1px solid #e9edf2;
        }
        .filters select,
        .filters button {
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #d1d9e6;
            background: #fff;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .filters select:hover,
        .filters button:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }
        .filters .btn-reset {
            background: #f1f5f9;
            border-color: #cbd5e1;
            color: #475569;
        }
        .filters .btn-reset:hover {
            background: #e2e8f0;
        }
        .filter-label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        /* ===== QUESTION CARD ===== */
        .question-card {
            background: #ffffff;
            border: 1px solid #e9edf2;
            border-radius: 20px;
            padding: 24px 28px;
            margin-bottom: 16px;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .question-card:hover {
            border-color: #cbd5e1;
        }
        .question-header {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: center;
            margin-bottom: 12px;
        }
        .question-id {
            font-weight: 600;
            color: #64748b;
            font-size: 13px;
            background: #f1f5f9;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .question-text {
            font-size: 17px;
            line-height: 1.7;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 14px;
            border: 1.5px solid #e9edf2;
            cursor: pointer;
            transition: 0.15s;
            background: #fafcff;
            font-size: 15px;
        }
        .option:hover {
            background: #f1f5f9;
            border-color: #b9c7da;
        }
        .option.selected {
            background: #dbeafe;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }
        .option.correct-reveal {
            background: #dcfce7;
            border-color: #22c55e;
        }
        .option.wrong-reveal {
            background: #fee2e2;
            border-color: #ef4444;
        }
        .option-letter {
            font-weight: 700;
            color: #64748b;
            min-width: 22px;
            font-size: 14px;
        }
        .option-text {
            flex: 1;
        }
        /* ===== EXPLANATION ===== */
        .explanation-box {
            margin-top: 14px;
            padding: 14px 18px;
            background: #f8fafc;
            border-radius: 14px;
            border-right: 4px solid #3b82f6;
            font-size: 14px;
            line-height: 1.7;
            color: #1e293b;
            display: none;
        }
        .explanation-box.show {
            display: block;
        }
        .explanation-box strong {
            color: #0b2b4a;
        }
        /* ===== NAVIGATION ===== */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #e9edf2;
        }
        .nav-buttons button {
            padding: 10px 28px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            background: #e9edf2;
            color: #1e293b;
        }
        .nav-buttons button:hover:not(:disabled) {
            background: #d1d9e6;
            transform: translateY(-1px);
        }
        .nav-buttons button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-primary {
            background: #0b2b4a !important;
            color: #fff !important;
        }
        .btn-primary:hover:not(:disabled) {
            background: #1a3f62 !important;
        }
        .btn-success {
            background: #16a34a !important;
            color: #fff !important;
        }
        .btn-success:hover:not(:disabled) {
            background: #15803d !important;
        }
        .btn-outline {
            background: transparent !important;
            border: 1.5px solid #cbd5e1 !important;
        }
        .btn-outline:hover:not(:disabled) {
            background: #f1f5f9 !important;
        }
        .progress-indicator {
            font-size: 14px;
            color: #475569;
            font-weight: 500;
        }
        /* ===== RESULTS ===== */
        .results-container {
            text-align: center;
            padding: 30px 10px 20px;
        }
        .results-container .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0b2b4a, #1a4a6e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 10px auto 20px;
            color: #fff;
            box-shadow: 0 8px 30px rgba(11, 43, 74, 0.25);
        }
        .score-circle .score-number {
            font-size: 52px;
            font-weight: 800;
            line-height: 1;
        }
        .score-circle .score-label {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .results-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
            margin: 18px 0 24px;
        }
        .results-stats .rs-item {
            background: #f8fafc;
            padding: 10px 24px;
            border-radius: 16px;
            border: 1px solid #e9edf2;
        }
        .results-stats .rs-item .rs-num {
            font-size: 26px;
            font-weight: 700;
        }
        .results-stats .rs-item .rs-label {
            font-size: 13px;
            color: #64748b;
        }
        .results-stats .rs-item.correct .rs-num {
            color: #16a34a;
        }
        .results-stats .rs-item.wrong .rs-num {
            color: #dc2626;
        }
        .results-stats .rs-item.empty .rs-num {
            color: #94a3b8;
        }
        .btn-restart {
            padding: 12px 40px;
            border-radius: 40px;
            border: none;
            background: #0b2b4a;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            margin-top: 8px;
        }
        .btn-restart:hover {
            background: #1a3f62;
            transform: translateY(-2px);
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .app-container {
                padding: 16px 14px 24px;
                border-radius: 20px;
            }
            h1 {
                font-size: 22px;
            }
            h1 small {
                font-size: 14px;
                width: 100%;
                margin-right: 0;
            }
            .question-card {
                padding: 16px 16px;
            }
            .question-text {
                font-size: 15px;
            }
            .option {
                font-size: 14px;
                padding: 8px 12px;
            }
            .stats-bar {
                padding: 10px 14px;
                gap: 10px 16px;
            }
            .stat-divider {
                display: none;
            }
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            .filters select,
            .filters button {
                width: 100%;
            }
            .nav-buttons {
                flex-direction: column;
            }
            .nav-buttons button {
                width: 100%;
                justify-content: center;
            }
            .results-stats {
                gap: 12px;
            }
            .results-stats .rs-item {
                padding: 8px 16px;
                flex: 1;
                min-width: 80px;
            }
            .score-circle {
                width: 120px !important;
                height: 120px !important;
            }
            .score-circle .score-number {
                font-size: 38px !important;
            }
        }
        @media (max-width: 420px) {
            .app-container {
                padding: 10px 8px 16px;
            }
            .question-card {
                padding: 12px 10px;
            }
            .option {
                font-size: 13px;
                padding: 6px 10px;
            }
        }
        /* ===== UTILITY ===== */
        .text-muted {
            color: #94a3b8;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gap-8 {
            gap: 8px;
        }
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* ===== LOADING SHIMMER ===== */
        .loading-shimmer {
            animation: shimmer 1.2s infinite;
            background: linear-gradient(90deg, #f1f5f9 25%, #e9edf2 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            border-radius: 12px;
            height: 60px;
            margin-bottom: 12px;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        /* ===== TOOLTIP ===== */
        .topic-tag {
            display: inline-block;
            background: #f1f5f9;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #475569;
        }
        .dose-tag {
            display: inline-block;
            background: #dbeafe;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #1e40af;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- HEADER -->
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">
            <div>
                <h1>
                    🧪 اختبار الكيمياء التحصيلي
                    <small>المتقدّم</small>
                </h1>
                <div class="subtitle">
                    <span>📚 بنك الأسئلة الشامل · 80 سؤالاً أصلياً</span>
                    <span style="font-weight:400;">
                        <span class="badge" style="background:#e9edf2;">🎯 8 جرعات</span>
                        <span class="badge" style="background:#e9edf2;">📊 3 مستويات</span>
                    </span>
                </div>
            </div>
            <div style="display:flex; gap:6px; align-items:center; background:#f8fafc; padding:6px 14px; border-radius:40px; border:1px solid #e9edf2;">
                <span style="font-size:13px; color:#475569;">✍️</span>
                <span style="font-size:13px; font-weight:500;">إبراهيم الدسوقي</span>
            </div>
        </div>

        <!-- STATS BAR -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-item"><span class="num" id="totalQ">0</span><span class="label">إجمالي الأسئلة</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="num" id="answeredQ">0</span><span class="label">تمّ الإجابة</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="num" id="correctQ">0</span><span class="label">✔ صحيح</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="num" id="wrongQ">0</span><span class="label">✘ خاطئ</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item" style="margin-right:auto;"><span class="num" id="progressPercent">0%</span><span class="label">مُنجز</span></div>
        </div>

        <!-- FILTERS -->
        <div class="filters" id="filterBar">
            <span class="filter-label">🔍 تصفية:</span>
            <select id="filterTopic">
                <option value="all">جميع الموضوعات</option>
            </select>
            <select id="filterDose">
                <option value="all">جميع الجرعات</option>
            </select>
            <select id="filterDifficulty">
                <option value="all">جميع المستويات</option>
                <option value="سهل">سهل</option>
                <option value="متوسط">متوسط</option>
                <option value="صعب">صعب</option>
            </select>
            <select id="filterStatus">
                <option value="all">الكل</option>
                <option value="answered">تمّت الإجابة</option>
                <option value="unanswered">لم تُجب</option>
                <option value="correct">صحيحة</option>
                <option value="wrong">خاطئة</option>
            </select>
            <button class="btn-reset" id="resetFiltersBtn">↺ إعادة ضبط</button>
            <button class="btn-reset" id="resetAllBtn" style="background:#fee2e2; border-color:#fca5a5; color:#991b1b;">🔄 إعادة الاختبار</button>
        </div>

        <!-- QUESTION LIST -->
        <div id="questionList"></div>

        <!-- NAVIGATION -->
        <div class="nav-buttons" id="navButtons">
            <button id="prevBtn" disabled>‹ السابق</button>
            <span class="progress-indicator" id="navProgress">السؤال 1 من 80</span>
            <button id="nextBtn" class="btn-primary">التالي ›</button>
        </div>

        <!-- RESULTS (hidden by default) -->
        <div id="resultsContainer" style="display:none;"></div>

    </div>

            "dose": "الجرعة 8"
        }, {

            "skill": "فهم واسترجاع",
            "difficulty": "سهل",
            "question": "ما المقياس الفيزيائي الذي يقيس مباشرة متوسط الطاقة الحركية لجميع جسيمات وجزيئات المادة الكيميائية؟",
            "A": "السعر الكيميائي الممتص",
            "B": "درجة الحرارة",
            "C": "اللزوجة الحركية",
            "D": "الضغط الجزئي للوعاء",
            "correct": "B",
            "explanation": "درجة الحرارة هي المقياس المعبر مباشرة عن معدل وحالة حركة وتذبذب الجسيمات دون المجهرية داخل البناء الكيميائي للمادة.",
            "dose": "الجرعة 8"
        }
    ];

    // ================================================================
    //  APP STATE
    // ================================================================
    const state = {
        questions: QUESTIONS,
        filtered: [],
        answers: {}, // questionId -> 'A'|'B'|'C'|'D'
        revealed: {}, // questionId -> boolean
        currentPage: 0,
        pageSize: 5,
        filterTopic: 'all',
        filterDose: 'all',
        filterDifficulty: 'all',
        filterStatus: 'all',
    };

    // ================================================================
    //  DOM REFS
    // ================================================================
    const $ = id => document.getElementById(id);
    const qList = $('questionList');
    const totalQ = $('totalQ');
    const answeredQ = $('answeredQ');
    const correctQ = $('correctQ');
    const wrongQ = $('wrongQ');
    const progressPercent = $('progressPercent');
    const prevBtn = $('prevBtn');
    const nextBtn = $('nextBtn');
    const navProgress = $('navProgress');
    const resultsContainer = $('resultsContainer');
    const filterTopic = $('filterTopic');
    const filterDose = $('filterDose');
    const filterDifficulty = $('filterDifficulty');
    const filterStatus = $('filterStatus');
    const resetFiltersBtn = $('resetFiltersBtn');
    const resetAllBtn = $('resetAllBtn');

    // ================================================================
    //  UTILITY
    // ================================================================
    const letterLabel = { A: 'أ', B: 'ب', C: 'ج', D: 'د' };

    function getDifficultyBadge(diff) {
        const map = {
            'سهل': 'badge-difficulty-easy',
            'متوسط': 'badge-difficulty-medium',
            'صعب': 'badge-difficulty-hard'
        };
        return map[diff] || '';
    }

    // ================================================================
    //  FILTER LOGIC
    // ================================================================
    function buildFilterOptions() {
        const topics = new Set();
        const doses = new Set();
        state.questions.forEach(q => { topics.add(q.topic);
            doses.add(q.dose); });
        // topics
        filterTopic.innerHTML = '<option value="all">جميع الموضوعات</option>';
        [...topics].sort().forEach(t => {
            filterTopic.innerHTML += `<option value="${t}">${t}</option>`;
        });
        // doses
        filterDose.innerHTML = '<option value="all">جميع الجرعات</option>';
        [...doses].sort().forEach(d => {
            filterDose.innerHTML += `<option value="${d}">${d}</option>`;
        });
    }

    function applyFilters() {
        const topic = filterTopic.value;
        const dose = filterDose.value;
        const diff = filterDifficulty.value;
        const status = filterStatus.value;

        let filtered = state.questions.filter(q => {
            if (topic !== 'all' && q.topic !== topic) return false;
            if (dose !== 'all' && q.dose !== dose) return false;
            if (diff !== 'all' && q.difficulty !== diff) return false;
            if (status === 'answered' && !state.answers[q.id]) return false;
            if (status === 'unanswered' && state.answers[q.id]) return false;
            if (status === 'correct' && state.answers[q.id] !== q.correct) return false;
            if (status === 'wrong' && state.answers[q.id] !== q.correct && state.answers[q.id]) return false;
            return true;
        });

        state.filtered = filtered;
        state.currentPage = 0;
        render();
    }

    // ================================================================
    //  RENDER
    // ================================================================
    function render() {
        const filtered = state.filtered;
        const total = filtered.length;
        const page = state.currentPage;
        const pageSize = state.pageSize;
        const start = page * pageSize;
        const end = Math.min(start + pageSize, total);
        const pageItems = filtered.slice(start, end);

        // Stats
        const totalAll = state.questions.length;
        const answeredCount = Object.keys(state.answers).filter(id => state.answers[id]).length;
        let correctCount = 0,
            wrongCount = 0;
        Object.keys(state.answers).forEach(id => {
            const q = state.questions.find(q => q.id === id);
            if (!q) return;
            if (state.answers[id] === q.correct) correctCount++;
            else if (state.answers[id]) wrongCount++;
        });
        totalQ.textContent = totalAll;
        answeredQ.textContent = answeredCount;
        correctQ.textContent = correctCount;
        wrongQ.textContent = wrongCount;
        progressPercent.textContent = totalAll ? Math.round((answeredCount / totalAll) * 100) + '%' : '0%';

        // Nav
        navProgress.textContent = total ? `السؤال ${start+1} – ${end} من ${total}` : 'لا توجد أسئلة';
        prevBtn.disabled = page === 0;
        nextBtn.disabled = end >= total;

        // Results visibility
        if (total === 0 && Object.keys(state.answers).length === state.questions.length) {
            // all answered, show results
            showResults();
            qList.innerHTML = '';
            resultsContainer.style.display = 'block';
            return;
        } else {
            resultsContainer.style.display = 'none';
        }

        // Build questions
        let html = '';
        pageItems.forEach((q, idx) => {
            const realIdx = start + idx + 1;
            const selected = state.answers[q.id] || null;
            const revealed = state.revealed[q.id] || false;
            const isCorrect = selected && selected === q.correct;
            const isWrong = selected && selected !== q.correct;

            let optionsHtml = '';
            const letters = ['A', 'B', 'C', 'D'];
            letters.forEach(letter => {
                const val = q[letter];
                if (!val) return;
                let cls = 'option';
                if (selected === letter) cls += ' selected';
                if (revealed && letter === q.correct) cls += ' correct-reveal';
                if (revealed && isWrong && selected === letter) cls += ' wrong-reveal';
                optionsHtml += `
                    <div class="${cls}" data-qid="${q.id}" data-letter="${letter}">
                        <span class="option-letter">${letterLabel[letter]}.</span>
                        <span class="option-text">${val}</span>
                    </div>
                `;
            });

            let explainHtml = '';
            if (revealed) {
                const statusIcon = isCorrect ? '✅' : '❌';
                const statusText = isCorrect ? 'إجابة صحيحة' : 'إجابة خاطئة';
                const correctAns = q.correct ? `${letterLabel[q.correct]}` : '';
                explainHtml = `
                    <div class="explanation-box show">
                        <strong>${statusIcon} ${statusText}</strong>
                        ${!isCorrect ? ` (الإجابة الصحيحة: ${correctAns})` : ''}
                        <br><strong>📖 الشرح:</strong> ${q.explanation || 'لا يوجد شرح.'}
                        <br><span class="topic-tag">${q.topic}</span>
                        <span class="dose-tag">${q.dose}</span>
                        <span class="badge ${getDifficultyBadge(q.difficulty)}">${q.difficulty}</span>
                    </div>
                `;
            }

            html += `
                <div class="question-card" id="card-${q.id}">
                    <div class="question-header">
                        <span class="question-id">${q.id}</span>
                        <span class="topic-tag">${q.topic}</span>
                        <span class="dose-tag">${q.dose}</span>
                        <span class="badge ${getDifficultyBadge(q.difficulty)}">${q.difficulty}</span>
                        ${selected ? `<span class="badge" style="background:#dbeafe;color:#1e40af;">✔ تمّت الإجابة</span>` : `<span class="badge" style="background:#f1f5f9;">⏳ لم تُجب</span>`}
                    </div>
                    <div class="question-text">${realIdx}. ${q.question}</div>
                    <div class="options">${optionsHtml}</div>
                    ${explainHtml}
                </div>
            `;
        });

        qList.innerHTML = html;

        // Attach option click listeners
        document.querySelectorAll('.option').forEach(el => {
            el.addEventListener('click', function(e) {
                const qid = this.dataset.qid;
                const letter = this.dataset.letter;
                // If already revealed, ignore
                if (state.revealed[qid]) return;
                // Save answer
                state.answers[qid] = letter;
                // Auto-reveal
                state.revealed[qid] = true;
                render();
            });
        });
    }

    // ================================================================
    //  RESULTS
    // ================================================================
    function showResults() {
        const total = state.questions.length;
        let correct = 0,
            wrong = 0,
            unanswered = 0;
        state.questions.forEach(q => {
            const ans = state.answers[q.id];
            if (!ans) unanswered++;
            else if (ans === q.correct) correct++;
            else wrong++;
        });
        const score = total ? Math.round((correct / total) * 100) : 0;

        // group by dose
        const doseStats = {};
        state.questions.forEach(q => {
            const d = q.dose || 'غير مصنف';
            if (!doseStats[d]) doseStats[d] = { total: 0, correct: 0 };
            doseStats[d].total++;
            if (state.answers[q.id] === q.correct) doseStats[d].correct++;
        });

        let doseHtml = '';
        Object.keys(doseStats).sort().forEach(d => {
            const s = doseStats[d];
            const pct = s.total ? Math.round((s.correct / s.total) * 100) : 0;
            doseHtml += `
                <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e9edf2;font-size:14px;">
                    <span><strong>${d}</strong></span>
                    <span>${s.correct}/${s.total} (${pct}%)</span>
                </div>
            `;
        });

        resultsContainer.innerHTML = `
            <div class="results-container">
                <div class="score-circle">
                    <span class="score-number">${score}%</span>
                    <span class="score-label">النتيجة النهائية</span>
                </div>
                <div class="results-stats">
                    <div class="rs-item correct"><span class="rs-num">${correct}</span><div class="rs-label">✔ صحيح</div></div>
                    <div class="rs-item wrong"><span class="rs-num">${wrong}</span><div class="rs-label">✘ خاطئ</div></div>
                    <div class="rs-item empty"><span class="rs-num">${unanswered}</span><div class="rs-label">⏳ لم تُجب</div></div>
                </div>
                <div style="max-width:400px;margin:10px auto 18px;text-align:right;background:#f8fafc;padding:12px 18px;border-radius:16px;border:1px solid #e9edf2;">
                    <div style="font-weight:600;margin-bottom:6px;">📊 الأداء حسب الجرعة</div>
                    ${doseHtml}
                </div>
                <button class="btn-restart" id="restartBtn">🔄 إعادة الاختبار من البداية</button>
            </div>
        `;
        document.getElementById('restartBtn').addEventListener('click', resetAll);
    }

    // ================================================================
    //  NAVIGATION
    // ================================================================
    function goToPage(page) {
        const total = state.filtered.length;
        const maxPage = Math.max(0, Math.ceil(total / state.pageSize) - 1);
        state.currentPage = Math.max(0, Math.min(page, maxPage));
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    prevBtn.addEventListener('click', () => goToPage(state.currentPage - 1));
    nextBtn.addEventListener('click', () => goToPage(state.currentPage + 1));

    // ================================================================
    //  FILTER EVENTS
    // ================================================================
    filterTopic.addEventListener('change', applyFilters);
    filterDose.addEventListener('change', applyFilters);
    filterDifficulty.addEventListener('change', applyFilters);
    filterStatus.addEventListener('change', applyFilters);
    resetFiltersBtn.addEventListener('click', () => {
        filterTopic.value = 'all';
        filterDose.value = 'all';
        filterDifficulty.value = 'all';
        filterStatus.value = 'all';
        applyFilters();
    });

    // ================================================================
    //  RESET ALL
    // ================================================================
    function resetAll() {
        state.answers = {};
        state.revealed = {};
        state.currentPage = 0;
        filterTopic.value = 'all';
        filterDose.value = 'all';
        filterDifficulty.value = 'all';
        filterStatus.value = 'all';
        applyFilters();
        resultsContainer.style.display = 'none';
    }
    resetAllBtn.addEventListener('click', resetAll);

    // ================================================================
    //  KEYBOARD SHORTCUTS
    // ================================================================
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            if (!nextBtn.disabled) nextBtn.click();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            if (!prevBtn.disabled) prevBtn.click();
        } else if (e.key === 'r' || e.key === 'R') {
            if (e.ctrlKey || e.metaKey) return;
            resetAll();
        }
    });

    // ================================================================
    //  INIT
    // ================================================================
    buildFilterOptions();
    applyFilters();

    // Auto-scroll to top on load
    window.scrollTo({ top: 0, behavior: 'auto' });
</script>
</body>
</html>
